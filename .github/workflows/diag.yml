name: Diag AI
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test GitHub Models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- catalog"; curl -sS -i -m 20 https://models.github.ai/catalog/models -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" | head -c 600; echo
          echo "--- chat"; curl -sS -i -m 40 -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Svar kun med ordet hei"}],"max_tokens":10}' | head -c 900; echo
          echo "--- azure"; curl -sS -i -m 30 -X POST https://models.inference.ai.azure.com/chat/completions -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d '{"model":"gpt-4.1-mini","messages":[{"role":"user","content":"hei"}],"max_tokens":10}' | head -c 600; echo
          echo "--- proxyenv"; env | grep -i proxy | sed 's/=.*/=<set>/'
